<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e140d" />
      <stop offset="70%" stop-color="#0a0705" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark base background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Ornate Clockwork Ring -->
  <circle cx="256" cy="256" r="215" stroke="url(#goldGrad)" stroke-width="8" fill="none" opacity="0.6" />
  <circle cx="256" cy="256" r="195" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 8" fill="none" opacity="0.8" />

  <!-- Quantum Portal Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#portalGlow)" filter="url(#glow)" />

  <!-- Clockwork gear teeth -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <rect x="248" y="32" width="16" height="24" rx="3" />
    <rect x="248" y="456" width="16" height="24" rx="3" />
    <rect x="32" y="248" width="24" height="16" rx="3" />
    <rect x="456" y="248" width="24" height="16" rx="3" />
    <rect x="98" y="98" width="16" height="20" rx="3" transform="rotate(-45 106 108)" />
    <rect x="398" y="98" width="16" height="20" rx="3" transform="rotate(45 406 108)" />
    <rect x="98" y="398" width="16" height="20" rx="3" transform="rotate(45 106 408)" />
    <rect x="398" y="398" width="16" height="20" rx="3" transform="rotate(-45 406 408)" />
  </g>

  <!-- Central Camera Lens / Temporal Shutter Reticle -->
  <circle cx="256" cy="256" r="110" stroke="url(#goldGrad)" stroke-width="6" fill="#090d16" />
  
  <!-- Shutter Blades -->
  <path d="M 256 160 L 290 220 L 256 220 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 338 214 L 314 274 L 284 256 Z" fill="url(#goldGrad)" opacity="0.7" />
  <path d="M 320 310 L 256 310 L 274 276 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 226 332 L 202 272 L 232 290 Z" fill="url(#goldGrad)" opacity="0.7" />
  <path d="M 174 256 L 238 256 L 220 290 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 192 180 L 216 240 L 246 222 Z" fill="url(#goldGrad)" opacity="0.7" />

  <!-- Core Lens Center -->
  <circle cx="256" cy="256" r="42" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="26" fill="#ffffff" />

  <!-- Lens reflection highlight -->
  <ellipse cx="244" cy="244" rx="14" ry="7" transform="rotate(-30 244 244)" fill="#ffffff" opacity="0.75" />
</svg>
